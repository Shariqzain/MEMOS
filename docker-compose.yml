version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # Storage Services
  # ─────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: memos-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: memos_admin
      MONGO_INITDB_ROOT_PASSWORD: memos_password
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.12
    container_name: memos-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP Web Interface
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/memos_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - MONGODB_URI=mongodb://memos_admin:memos_password@mongodb:27017
      - MONGODB_DATABASE=memos_db
      - CHROMADB_PATH=/app/data/chroma
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=memos_password
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    name: memos_mongo_data
  neo4j_data:
    name: memos_neo4j_data
  chroma_data:
    name: memos_chroma_data
